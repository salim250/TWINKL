<div style="background:#f6f7fb;padding:30px 0;font-family:Arial,Helvetica,sans-serif;">

    <div style="
        max-width:650px;
        margin:auto;
        background:white;
        border-radius:14px;
        overflow:hidden;
        border:1px solid #eee;
    ">

        <!-- Header -->
        <div style="
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
            padding:25px;
            color:white;
        ">

            <h1 style="margin:0;font-size:22px;">
                Enrollment Received
            </h1>

            <p style="margin-top:8px;font-size:14px;">
                TWINKL Education
            </p>

        </div>

        <!-- Body -->
        <div style="padding:30px;color:#374151;">

            <h2 style="font-size:18px;color:#4f46e5;">
                Hello {{student_name}},
            </h2>

            <p style="line-height:1.6;">
                We have successfully received your enrollment application.
            </p>

            <p style="line-height:1.6;">
                Our team will review it and contact you shortly.
            </p>

            <p style="margin-top:25px;">
                Best regards,<br />
                <b>TWINKL Education Team</b>
            </p>

        </div>

        <!-- Footer -->
        <div style="
            background:#fafafa;
            padding:15px;
            text-align:center;
            color:#888;
            font-size:12px;
        ">

            © {{year}} TWINKL Education

        </div>

    </div>

</div>
